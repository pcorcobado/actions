name: "Run Operations Script'"
description: "Applies weekend gating and executes the appropiate .sh scripts for turning on/off based on project, environment and operation"

inputs:
  operation:
    required: true
    description: "Operation to perform (turn_on / turn_off)"
  environment:
    required: true
    description: "Environment of the project (dev / pre)"
  project:
    required: true
    description: "Name of the project"

outputs:
  op:
    description: "Resolved operation: On or Off"
    value: ${{ steps.run.outputs.op }}
  ran:
    description: "Indicates if the operation was executed (weekend gating)"
    value: ${{ steps.run.outputs.ran }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: |
        OP_UPPER=$(printf '%s' "${{ inputs.operation }}" | tr '[:lower:]' '[:upper:]')
        if [ "$OP_UPPER" = "TURN_ON" ]; then Op="On"; else Op="Off"; fi
        echo "op=$Op" >> "$GITHUB_OUTPUT"
        echo "---------- OP: $op ----------"
        dayOfWeek=$(date +%u); dayOfMonth=$(date +%d); isWeekend=false
        if [ "$dayOfWeek" -eq 6 ] || [ "$dayOfWeek" -eq 7 ]; then isWeekend=true; fi
        if [ "$Op" = "On" ]; then targetDay=1; else targetDay=4; fi
        ran=true
        if [ "$isWeekend" = true ] && [ "$dayOfMonth" -ne "$targetDay" ]; then ran=false; fi
        echo "ran=$ran" >> "$GITHUB_OUTPUT"
        if [ "$ran" != "true" ]; then
          echo "Fin de semana fuera de la ventana permitida (dia $dayOfMonth). Se omite la operacion."
          exit 0
        fi
        SCRIPTS_DIR="${{ github.action_path }}/scripts"
        run_script(){
          local script="$1"; exit
          echo -e "\n\n---------- ${{ inputs.project}} ${{inputs.environment }} ${ script} ${@} ----------\n"
          chmod +x "$SCRIPTS_DIR/$script"
          "$SCRIPTS_DIR/$SCRIPT" "$@"
        }
        KEY="${{ inputs.project }}_${{ inputs.environment }}"
        case "$KEY" in
          project1|project3|project5)
            if [ "$Op" = "On" ]; then
              run_script turnOnEC2.sh
              run_script turnOnRDS.sh
            else
              run_script turnOffEC2.sh
              run_script turnOffRDS.sh
            fi
            ;;
          project2)
            if [ ""$Op" = "On" ]; then
              run_script turnOnEC2.sh
              run_script turnOnRDS.sh
            else
              run_script turnOffEC2.sh
              run_script turnOffRDS.sh
            fi
            ;;
          project4)
            if [ ""$Op" = "On" ]; then
              run_script turnOnEC2.sh
              run_script turnOnRDS.sh
            else
              run_script turnOffEC2.sh
              run_script turnOffRDS.sh
            fi
            ;;
          *)
            echo "No hay logica de encendido/apagado configurada para $KEY" >&2
            exit 1
            ;;
        esac
